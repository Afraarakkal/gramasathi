<!DOCTYPE html>
<html>
<head>
  <title>Dummy Scheme Form</title>
</head>
<body>
  <h2>Scheme Application Form</h2>

  <form>
    <input type="text" id="fullName" placeholder="Full Name" /><br/><br/>
    <input type="email" id="emailField" placeholder="Email" /><br/><br/>
    <input type="text" id="phoneInput" placeholder="Phone" /><br/><br/>
    <input type="text" id="addr" placeholder="Address" /><br/><br/>
    <textarea id="details" placeholder="Details"></textarea><br/><br/>
    <button id="submitBtn" type="button"
      onclick="alert('Form Submitted Successfully!')">
      Submit
    </button>
  </form>

</body>
</html>
